name: Quality Gates

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'desktop/**'
      - 'eslint-plugins/**'
      - 'scripts/ci/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
      - 'LICENSE'
      - 'scripts/demo-guard.mjs'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/quality-gates.yml'
  push:
    branches: [main, codex/**]
  workflow_dispatch:

# 各质量门并行执行；任一道失败都应阻断合并
jobs:
  demo-guard:
    name: ① Demo舱隔离规范
    uses: ./.github/workflows/demo-guard.yml

  third-party-notices:
    name: 第三方许可证与声明
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验第三方许可证与声明
        run: node scripts/ci/third-party-notices-ci.mjs

  newui-anchor:
    name: ② 新版UI锚点（防回退旧版）
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验新版身份证
        run: node scripts/ci/newui-anchor-check.mjs

  lint-frontend:
    name: ③ 前端 ESLint（含 demo-guard 自定义规则）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 跑 ESLint
        working-directory: frontend
        env:
          NODE_OPTIONS: ''
        run: npm run lint

  type-check-frontend:
    name: ④ 前端 TypeScript 严格类型
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 跑 tsc
        working-directory: frontend
        env:
          NODE_OPTIONS: ''
        run: npx tsc --noEmit

  frontend-commercial-guards:
    name: ⑤ 前端商用回归守卫
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 跑前端合约测试
        working-directory: frontend
        env:
          NODE_OPTIONS: '--experimental-transform-types'
        run: node --test scripts/*.test.mjs
      - name: 跑关键页面守卫
        working-directory: frontend
        env:
          NODE_OPTIONS: '--experimental-transform-types'
        run: |
          npm run navigation:zero-loss
          npm run content-workspace:guard
          npm run local-engine:guard
          npm run astryx:migration:guard
          npm run commercial-copy:guard

  lint-backend:
    name: ⑥ 后端 ESLint（含 demo-guard 自定义规则）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: 安装依赖
        working-directory: backend
        run: npm ci
      - name: 跑 ESLint
        working-directory: backend
        env:
          NODE_OPTIONS: ''
        run: npm run lint

  type-check-backend:
    name: ⑦ 后端 TypeScript 严格类型
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: 安装依赖
        working-directory: backend
        run: npm ci
      - name: 跑 tsc
        working-directory: backend
        env:
          NODE_OPTIONS: ''
        run: npx tsc --noEmit

  circular-check-backend:
    name: ⑧ 后端依赖环检测（0 环门槛）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: 安装依赖
        working-directory: backend
        run: npm ci
      - name: 跑依赖环检测
        working-directory: backend
        env:
          NODE_OPTIONS: ''
        run: npm run circular:check

  desktop-bridge-tests:
    name: ⑨ 桌面只读桥单测（Electron main/preload）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 跑桌面只读桥单测（node:test 零依赖，无需 Electron）
        working-directory: desktop
        env:
          NODE_OPTIONS: ''
        run: npm run test:local-bridge

  # ==================== 安全扫描 ====================
  secrets-scan:
    name: ⑩ 密钥泄露扫描（Gitleaks）
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全历史，确保历史提交也扫
      - name: 跑 Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: ⑪ 依赖漏洞审计（npm audit）
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      # 高危/严重级依赖漏洞直接阻断；moderate 及以下仅提示（不阻断开发节奏）
      - name: 后端依赖审计（high 及以上阻断）
        working-directory: backend
        run: npm audit --audit-level=high
      - name: 前端依赖审计（high 及以上阻断）
        working-directory: frontend
        run: npm audit --audit-level=high

  sast-semgrep:
    name: ⑫ SAST 静态安全扫描（Semgrep OWASP/CWE）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 跑 Semgrep（OWASP Top 10 + CWE Top 25）
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/cwe-top-25
          generateSarif: false

  sqlite-schema-guard:
    name: ⑬ SQLite 建表完整性守卫（防缺表老问题复发）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验 schema.prisma 与 ensureSqliteCoreTables 建表 SQL 对齐
        run: node scripts/ci/sqlite-schema-guard.mjs

  mobile-regression-guard:
    name: ⑭ 真机回归守卫（建表/权限/BigInt/路由404）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: 安装后端依赖 + Playwright Chromium
        working-directory: backend
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: 构建后端 SQLite bundle
        working-directory: backend
        run: npm run build:bundle:sqlite
      - name: 构建前端静态产物（同源 /api，防跨域丢 cookie）
        working-directory: frontend
        run: |
          echo 'NEXT_PUBLIC_API_BASE=/api' > .env.local
          npm ci
          npm run build
      - name: 起前端静态服务器并跑真机回归守卫
        run: |
          node frontend/scripts/static-server.mjs --port 3010 --root out > /tmp/frontend-3010.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          curl -s -o /dev/null -w '前端就绪: %{http_code}\n' http://127.0.0.1:3010/message.html || true
          REGRESSION_FRONTEND_URL=http://127.0.0.1:3010 node --experimental-sqlite scripts/ci/mobile-regression-guard.mjs
          EXIT_CODE=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE

  # ==================== 单测接入（2026-08-18 Tessa 门禁空转修复）====================
  # 此前前端 vitest 与后端 jest 均未被任何 workflow 执行（191 个测试零运行），
  # 此处补齐，让写好的测试真正成为回归防线。
  test-frontend:
    name: ⑮ 前端单测（Vitest）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 跑 Vitest 单测
        working-directory: frontend
        env:
          NODE_OPTIONS: ''
        run: npm run test

  test-backend:
    name: ⑯ 后端单测（Jest）
    # macOS runner：部分 spec 依赖 macOS 桌面环境（微信窗口/屏幕捕获/真实进程
    # 检测）与 sharp 原生二进制，ubuntu 上必失败（2026-08-18 首跑验证）
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: 安装依赖
        working-directory: backend
        run: npm ci
      - name: 跑 Jest 单测
        working-directory: backend
        env:
          NODE_OPTIONS: ''
        # --runInBand：并行 worker 下存在测试间状态污染（lead-score 等 1-2 个
        # 套件偶发失败，串行全绿 1912/1912），牺牲并行换取确定性
        # --testPathIgnorePatterns：auto-upload.client.spec 依赖本机真实微信
        # 进程（半集成测试），CI 干净环境必失败；其回归价值由 ⑭ 真机守卫覆盖
        run: >-
          npm run test -- --silent --runInBand
          --testPathIgnorePatterns="src/modules/auto-upload/auto-upload.client.spec.ts"
