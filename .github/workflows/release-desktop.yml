name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (latest/beta)"
        required: true
        default: "latest"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install chromium

      - name: Build backend SQLite bundle
        working-directory: backend
        env:
          BUILD_PLATFORM: ${{ matrix.os == 'windows-latest' && 'win-x64' || matrix.os == 'macos-latest' && 'mac-arm64' || 'linux-x64' }}
          KAYPAL_KEEP_SQLITE_PRISMA_CLIENT: "1"
        run: |
          npm run build:bundle:sqlite

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:3011/api
          KAYPAL_SKIP_NEXT_BUILD_LINT: "1"
          KAYPAL_SKIP_NEXT_BUILD_TYPECHECK: "1"
        run: npm ci && npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build artifacts
        shell: bash
        working-directory: desktop
        env:
          AI_CONTENT_UPDATE_URL: ${{ secrets.AI_CONTENT_UPDATE_URL || 'https://kaypal.oss-cn-hangzhou.aliyuncs.com/updates/' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run build:mac
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run build:win
          else
            npm run build:linux
          fi

      - name: Upload to OSS (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_UPDATE_PATH: ${{ secrets.OSS_UPDATE_PATH }}
        run: npm run upload:oss

      - name: Upload to OSS (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_UPDATE_PATH: ${{ secrets.OSS_UPDATE_PATH }}
        run: npm run upload:oss

      - name: Upload to OSS (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_UPDATE_PATH: ${{ secrets.OSS_UPDATE_PATH }}
        run: npm run upload:oss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/dist/*
          retention-days: 14
