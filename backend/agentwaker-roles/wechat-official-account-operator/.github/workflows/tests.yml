name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
      - name: Run unit tests
        run: |
          find wechat-official-account-operator-skills -name 'test_*.py' -type f -print0 |
            sort -z |
            xargs -0 -n1 python3
      - name: Check syntax and local documentation links
        run: |
          python3 -m compileall -q wechat-official-account-operator-skills
          find tools -name '*.rb' -type f -print0 |
            sort -z |
            xargs -0 -n1 ruby -c
          sh -n wechat-official-account-operator-skills/publish-wechat-article/server/wechat-token-read
          ruby tools/check-markdown-links.rb
      - name: Render the bundled article example
        run: |
          output="$(mktemp -d)/article.example.html"
          python3 \
            wechat-official-account-operator-skills/format-wechat-article/scripts/render_wechat_html.py \
            wechat-official-account-operator-skills/format-wechat-article/references/article.example.md \
            --output "$output" \
            --theme green-tech \
            --standalone \
            --embed-local-images
          grep -q 'data:image/png;base64' "$output"
      - name: Validate as an AgentWaker role
        run: |
          ruby tools/validate-capabilities.rb
          ruby tools/validate-role.rb . --phase standalone
