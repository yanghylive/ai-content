<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>workspace tabs</title>
<style>
  :root {
    --bg: #f2f3f5;
    --card: #ffffff;
    --text: #1f2329;
    --text-dim: #646a73;
    --text-faint: #8f959e;
    --border: rgba(31, 35, 41, 0.09);
    --hover: rgba(31, 35, 41, 0.06);
    --press: rgba(31, 35, 41, 0.1);
    --accent: #722ed1;
    --gold: #b06e10;
    --gold-soft: rgba(217, 143, 43, 0.12);
    --danger: #f54a45;
    --shadow-tab: 0 1px 2px rgba(0, 0, 0, 0.08);
    --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.14), 0 2px 6px rgba(0, 0, 0, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #23242a;
      --text: #f2f3f5;
      --text-dim: #bbbfc4;
      --text-faint: #8f959e;
      --border: rgba(255, 255, 255, 0.1);
      --hover: rgba(255, 255, 255, 0.08);
      --press: rgba(255, 255, 255, 0.13);
      --accent: #a171f0;
      --gold: #e0a44a;
      --gold-soft: rgba(224, 164, 74, 0.16);
      --shadow-tab: 0 1px 2px rgba(0, 0, 0, 0.5);
      --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: stretch;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #strip {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 40px;
    padding: 0 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 13px; letter-spacing: .2px;
    padding-right: 10px; margin-right: 2px;
    border-right: 1px solid var(--border);
    white-space: nowrap; color: var(--text);
  }
  /* 品牌字标与系统页面底部左下角同款：jiuzhang-wordmark（图形+JIUZHANG AI 一体），
     浅色用黑字版、深色用白字版（沿用 DashboardFooter 的双 img 换色方案）。
     assets/brand/ 目录已随打包白名单（assets 通配）带上。 */
  .brand img {
    height: 18px; width: auto; display: block;
    -webkit-user-drag: none; user-select: none;
  }
  .brand img.wb-light { display: block; }
  .brand img.wb-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .brand img.wb-light { display: none; }
    .brand img.wb-dark { display: block; }
  }
  .pill {
    flex: 0 0 auto;
    padding: 4px 10px;
    background: transparent;
    border: none; border-radius: 6px;
    color: var(--gold); font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background .12s;
  }
  .pill:hover { background: var(--gold-soft); }
  .hidden { display: none; }
  .tabs {
    display: flex; align-items: center; gap: 2px;
    flex: 1; min-width: 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 7px;
    height: 28px; max-width: 200px;
    padding: 0 8px 0 10px;
    background: transparent;
    border: none; border-radius: 7px;
    color: var(--text-dim);
    cursor: pointer; white-space: nowrap;
    transition: background .12s, color .12s, box-shadow .12s;
  }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab.active { background: var(--card); color: var(--text); box-shadow: var(--shadow-tab); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  .tab.octop .dot { background: var(--gold); }
  .tab.web .dot { background: var(--text-faint); }
  .tab .title { overflow: hidden; text-overflow: ellipsis; font-weight: 450; }
  .tab.active .title { font-weight: 600; }
  .tab .ws {
    font-size: 10px; color: var(--gold);
    background: var(--gold-soft);
    padding: 1px 5px; border-radius: 4px;
    cursor: pointer; flex: 0 0 auto;
  }
  .tab .ws:hover { filter: brightness(1.08); }
  .tab .close {
    width: 16px; height: 16px; line-height: 15px; text-align: center;
    border-radius: 4px; color: var(--text-faint); font-size: 13px;
    flex: 0 0 auto; opacity: 0; transition: opacity .12s, background .12s, color .12s;
  }
  .tab:hover .close, .tab.active .close { opacity: 1; }
  .tab .close:hover { background: var(--press); color: var(--text); }
  /* TraeWork 对齐：浏览器面板 = 标签条里的一等公民（站点 favicon chip） */
  .tab.browser .fav { width: 14px; height: 14px; border-radius: 4px; font-size: 9px; }
  .fav { flex: none; width: 14px; height: 14px; border-radius: 4px; color: #fff;
    font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .fav.douyin { background: #161823; } .fav.xiaohongshu { background: #ff2442; }
  .fav.weixin { background: #07c160; } .fav.channels { background: #07c160; }
  .fav.baidu { background: #2932e1; } .fav.bilibili { background: #fb7299; }
  .fav.taobao { background: #ff5000; } .fav.jd { background: #e1251b; }
  .fav.zhihu { background: #0084ff; } .fav.github { background: #24292f; }
  .fav.generic { background: #b9bec6; }
  .tab.browser { color: var(--text-dim); }
  .tab.browser.active { background: var(--card); color: var(--text); box-shadow: var(--shadow-tab); }
  .tab.dim { opacity: .55; }
  .tab.dim:hover { opacity: 1; }
  .iconbtn {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 7px;
    color: var(--text-dim); cursor: pointer;
    transition: background .12s, color .12s;
  }
  .iconbtn:hover { background: var(--hover); color: var(--text); }
  .iconbtn:active { background: var(--press); }
  .iconbtn.open { background: var(--press); color: var(--text); }
  .iconbtn svg { width: 16px; height: 16px; }
  .menu {
    position: fixed; z-index: 50; min-width: 216px;
    background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow-pop);
    padding: 4px; display: none;
  }
  .menu.open { display: block; }
  .menu button {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    width: 100%; text-align: left;
    background: none; border: none; border-radius: 6px;
    padding: 7px 9px; font-size: 13px; color: var(--text);
    cursor: pointer; font-family: inherit;
  }
  .menu button:hover { background: var(--hover); }
  .menu button.danger { color: var(--danger); }
  .menu .kbd { font-size: 11px; color: var(--text-faint); }
  .menu hr { border: none; border-top: 1px solid var(--border); margin: 4px 6px; }
  .menu .chk {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 9px; font-size: 13px; color: var(--text);
    cursor: pointer; border-radius: 6px;
  }
  .menu .chk:hover { background: var(--hover); }
  .menu .chk input { accent-color: var(--accent); width: 14px; height: 14px; }
  .pop {
    position: fixed; z-index: 50; width: 264px;
    background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow-pop);
    padding: 12px; display: none;
  }
  .pop.open { display: block; }
  .pop .lbl { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .pop input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; font-size: 12px; outline: none; font-family: inherit;
  }
  .pop input:focus { border-color: var(--accent); }
  .popbtns { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; }
  .popbtns button {
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    font-family: inherit; transition: background .12s;
  }
  .popbtns button:hover { background: var(--hover); }
  .popbtns button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .popbtns button.primary:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div id="strip">
    <span class="brand" title="JIUZHANG AI">
      <img class="wb-light" src="assets/brand/jiuzhang-wordmark-black.webp" alt="JIUZHANG AI" />
      <img class="wb-dark" src="assets/brand/jiuzhang-wordmark-white.webp" alt="JIUZHANG AI" />
    </span>
    <div class="pill hidden" id="octopPill" title="打开 Octop 高级模式">Octop 高级模式</div>
    <div class="tabs" id="tabs"></div>
    <button class="iconbtn" id="add" type="button" title="新建标签" aria-label="新建标签">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="iconbtn hidden" id="wHalf" type="button" title="面板半宽">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/><rect x="12" y="4" width="9" height="16" fill="currentColor" stroke="none" opacity=".22"/></svg>
    </button>
    <button class="iconbtn hidden" id="wMax" type="button" title="面板加宽（最大 60%）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><rect x="15" y="4" width="6" height="16" fill="currentColor" stroke="none" opacity=".22"/></svg>
    </button>
    <button class="iconbtn" id="more" type="button" title="更多" aria-label="更多">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
    </button>
  </div>

  <!-- ＋ = 浏览器式新建菜单（TraeWork 对齐）；⋯ = 溢出设置 -->
  <div class="menu" id="addMenu">
    <button type="button" data-act="new">新建工作区标签<span class="kbd">⌘T</span></button>
    <button type="button" data-act="browser-current">在浏览器面板打开当前页</button>
    <button type="button" data-act="browser-new">新建浏览器标签</button>
    <hr />
    <button type="button" data-act="octop">打开 Octop 高级模式</button>
  </div>

  <div class="menu" id="menu">
    <label class="chk"><input type="checkbox" id="pinOctop" />Octop 入口常驻标签栏</label>
  </div>

  <div class="menu" id="ctx">
    <button type="button" data-act="rename">重命名标签</button>
    <button type="button" data-act="bind">绑定工作区…</button>
    <button type="button" data-act="close" class="danger">关闭标签</button>
  </div>

  <div class="pop" id="wspop">
    <div class="lbl">绑定工作区 ID（请求将携带 x-workspace-id 做数据隔离）</div>
    <input id="wsPopInput" type="text" placeholder="输入工作区 ID，留空解除绑定" />
    <div class="popbtns">
      <button type="button" id="wsUnbind">解绑</button>
      <button type="button" id="wsBind" class="primary">绑定</button>
    </div>
  </div>

<script>
  // 浏览器预览垫片：非 Electron 环境（无 preload 注入的 window.tabStrip）时，
  // 用 mock 标签数据渲染同一份壳，供所见即所得调样式；Electron 内此分支不执行。
  if (!window.tabStrip) {
    const MOCK_TABS = [
      { id: 'biz', title: '业务工作区', pinned: true, active: true, kind: 'business' },
      { id: 'ws1', title: '今日增长', kind: 'business', workspaceId: 'ws-8f3c21' },
      { id: 'ws2', title: '获客任务 · 抖音装修', kind: 'business' },
      { id: 'ws3', title: '内容运营', kind: 'business' },
      { id: 'oct1', title: 'Octop 高级模式', kind: 'octop' },
    ];
    const MOCK_PANEL = {
      visible: true, hasSession: true, panelWidth: 480, tabActiveIndex: 0,
      tabList: [{ title: '抖音 · 装修视频评论区', url: 'https://www.douyin.com/video/7498231' }],
    };
    window.tabStrip = {
      send: (channel, ...args) => console.log('[preview mock send]', channel, ...args),
      on: (channel, cb) => {
        if (channel === 'browser-panel:state') setTimeout(() => cb(MOCK_PANEL), 0);
      },
      invoke: (name) =>
        name === 'workspace-tabs:list' ? Promise.resolve(MOCK_TABS) : Promise.resolve([]),
    };
  }

  const tabsEl = document.getElementById('tabs');
  const menuEl = document.getElementById('menu');
  const ctxEl = document.getElementById('ctx');
  const popEl = document.getElementById('wspop');
  const popInput = document.getElementById('wsPopInput');
  const octopPill = document.getElementById('octopPill');
  const pinChk = document.getElementById('pinOctop');
  const addBtn = document.getElementById('add');
  const moreBtn = document.getElementById('more');
  const addMenuEl = document.getElementById('addMenu');
  const wHalfBtn = document.getElementById('wHalf');
  const wMaxBtn = document.getElementById('wMax');
  const state = { activeId: null, tabs: [] };
  /** 浏览器面板状态（browser-panel:state 广播驱动 chip/预设按钮渲染） */
  let panelState = null;
  let popTabId = null;
  let ctxTarget = null;

  /* ---------- Octop 入口：默认收起，用户勾选后常驻（localStorage 持久化） ---------- */
  function isOctopPinned() {
    try { return localStorage.getItem('octopPinned') === '1'; } catch (e) { return false; }
  }
  function syncOctopPill() {
    const p = isOctopPinned();
    octopPill.classList.toggle('hidden', !p);
    pinChk.checked = p;
  }
  octopPill.addEventListener('click', () => { hideAll(); window.tabStrip.send('tab-strip:request-octop'); });
  pinChk.addEventListener('change', () => {
    try { localStorage.setItem('octopPinned', pinChk.checked ? '1' : '0'); } catch (e) {}
    syncOctopPill();
  });

  /* 标签条视图只有 38px 高，弹层越界会被裁掉（用户视角=点了没反应）。
     开合弹层时把需要的视图总高上报主进程临时加高（同控制条快捷行思路）。 */
  function announcePopup() {
    let bottom = 38;
    for (const el of [addMenuEl, menuEl, ctxEl, popEl]) {
      if (el.classList.contains('open')) bottom = Math.max(bottom, Math.ceil(el.getBoundingClientRect().bottom) + 6);
    }
    window.tabStrip.send('tab-strip:popup', Math.min(bottom, 340));
  }
  function hideAll() {
    addMenuEl.classList.remove('open');
    menuEl.classList.remove('open');
    ctxEl.classList.remove('open');
    popEl.classList.remove('open');
    addBtn.classList.remove('open');
    moreBtn.classList.remove('open');
    announcePopup();
  }
  document.addEventListener('mousedown', (e) => {
    if (e.target.closest('.menu') || e.target.closest('.pop') || e.target.closest('#add') || e.target.closest('#more') || e.target.closest('.ws')) return;
    // 上面 .menu 已覆盖 addMenu（同 class）
    hideAll();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideAll(); });

  /* ---------- 渲染 ---------- */
  function render() {
    tabsEl.innerHTML = '';
    for (const t of state.tabs) {
      const el = document.createElement('div');
      const cls = ['tab'];
      if (t.id === state.activeId) cls.push('active');
      if (t.kind === 'octop') cls.push('octop');
      if (t.kind === 'web') cls.push('web');
      el.className = cls.join(' ');
      const dot = document.createElement('span');
      dot.className = 'dot';
      el.appendChild(dot);
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = t.title || '工作台';
      el.appendChild(title);
      if (t.workspaceId) {
        const ws = document.createElement('span');
        ws.className = 'ws';
        ws.textContent = 'WS:' + t.workspaceId.slice(0, 6);
        ws.title = t.workspaceId + '（点击修改绑定）';
        ws.addEventListener('click', (e) => { e.stopPropagation(); openBind(t, ws); });
        el.appendChild(ws);
      }
      // 固定标签（业务工作区）不可关闭，不渲染关闭按钮
      if (!t.pinned) {
        const close = document.createElement('span');
        close.className = 'close';
        close.textContent = '×';
        close.onclick = (e) => { e.stopPropagation(); window.tabStrip.send('tab-strip:close', t.id); };
        el.appendChild(close);
      }
      el.addEventListener('click', () => window.tabStrip.send('tab-strip:switch', t.id));
      el.addEventListener('dblclick', (e) => { e.preventDefault(); startRename(el, t, title); });
      el.addEventListener('contextmenu', (e) => { e.preventDefault(); openCtx(t, e.clientX, e.clientY, el, title); });
      tabsEl.appendChild(el);
    }
    renderBrowserChip();
  }

  /* ---------- 浏览器面板 chip（TraeWork：浏览器是标签条一等公民） ---------- */
  const FAVS = [
    [/douyin\.com/, 'douyin', '抖'], [/xiaohongshu/, 'xiaohongshu', '红'],
    [/channels\.weixin/, 'channels', '视'], [/weixin\.qq/, 'weixin', '微'],
    [/mp\.weixin/, 'weixin', '微'], [/baidu\.com/, 'baidu', '百'],
    [/bilibili/, 'bilibili', 'B'], [/taobao/, 'taobao', '淘'],
    [/jd\.com/, 'jd', '京'], [/zhihu/, 'zhihu', '知'],
    [/github/, 'github', 'G'],
  ];
  function favFor(url) {
    try {
      const host = new URL(url).hostname;
      for (const [re, key, letter] of FAVS) if (re.test(host)) return `<span class="fav ${key}">${letter}</span>`;
      const l = host.split('.')[0].replace(/^www\./, '')[0] || '网';
      return `<span class="fav generic">${l.toUpperCase()}</span>`;
    } catch (e) { return ''; }
  }
  function panelTitle() {
    const list = panelState && Array.isArray(panelState.tabList) ? panelState.tabList : [];
    const cur = list[panelState ? panelState.tabActiveIndex : 0] || list[0];
    return (cur && (cur.title || cur.url)) || '浏览器面板';
  }
  function renderBrowserChip() {
    if (!panelState || !(panelState.visible || panelState.hasSession)) return;
    const el = document.createElement('div');
    el.className = 'tab browser' + (panelState.visible ? ' active' : ' dim');
    el.title = panelState.visible ? '浏览器面板已打开（点击保持/收起用 ×）' : '浏览器面板已收起（点击恢复）';
    const cur = (panelState && Array.isArray(panelState.tabList)
      ? panelState.tabList[panelState.tabActiveIndex] || panelState.tabList[0] : null);
    el.insertAdjacentHTML('afterbegin', favFor(cur && (cur.url || cur.title) || ''));
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = panelTitle();
    el.appendChild(title);
    if (panelState.visible) {
      const close = document.createElement('span');
      close.className = 'close';
      close.textContent = '×';
      close.title = '收起浏览器面板';
      close.onclick = (e) => { e.stopPropagation(); window.tabStrip.send('tab-strip:browser-hide'); };
      el.appendChild(close);
    }
    el.addEventListener('click', () => window.tabStrip.send('tab-strip:browser-show'));
    tabsEl.appendChild(el);
    wHalfBtn.classList.toggle('hidden', !panelState.visible);
    wMaxBtn.classList.toggle('hidden', !panelState.visible);
  }

  /* ---------- 双击/右键改名（Enter 提交 / Esc 取消 / 失焦提交） ---------- */
  function startRename(el, t, title) {
    if (el.querySelector('input.rename')) return;
    const prev = t.title || '工作台';
    title.style.display = 'none';
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'rename';
    input.value = prev;
    input.style.cssText = 'width:110px;background:var(--bg);color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:1px 4px;font-size:12px;outline:none;';
    el.insertBefore(input, title);
    input.focus();
    input.select();
    let done = false;
    const commit = (save) => {
      if (done) return;
      done = true;
      const name = input.value.trim();
      input.remove();
      title.style.display = '';
      if (save && name && name !== prev) {
        window.tabStrip.send('tab-strip:rename', t.id, name);
      }
    };
    input.addEventListener('keydown', (ev) => {
      ev.stopPropagation();
      if (ev.key === 'Enter') commit(true);
      else if (ev.key === 'Escape') commit(false);
    });
    input.addEventListener('blur', () => commit(true));
    input.addEventListener('click', (ev) => ev.stopPropagation());
  }

  /* ---------- 标签右键菜单 ---------- */
  function openCtx(t, x, y, el, title) {
    ctxTarget = { t, el, title };
    ctxEl.querySelector('[data-act="close"]').style.display = t.pinned ? 'none' : '';
    ctxEl.style.left = Math.min(x, window.innerWidth - 230) + 'px';
    ctxEl.style.top = (y + 4) + 'px';
    menuEl.classList.remove('open');
    popEl.classList.remove('open');
    ctxEl.classList.add('open');
    announcePopup();
  }
  ctxEl.addEventListener('click', (e) => {
    const act = e.target.getAttribute('data-act');
    if (!act || !ctxTarget) return;
    hideAll();
    if (act === 'rename') startRename(ctxTarget.el, ctxTarget.t, ctxTarget.title);
    if (act === 'bind') openBind(ctxTarget.t, null);
    if (act === 'close') window.tabStrip.send('tab-strip:close', ctxTarget.t.id);
  });

  /* ---------- 工作区绑定气泡（点 WS 徽章 / 右键菜单打开） ---------- */
  function openBind(t, anchor) {
    popTabId = t.id;
    popInput.value = t.workspaceId || '';
    if (anchor) {
      const r = anchor.getBoundingClientRect();
      popEl.style.left = Math.min(r.left, window.innerWidth - 280) + 'px';
      popEl.style.top = (r.bottom + 6) + 'px';
    } else {
      popEl.style.left = Math.max(8, window.innerWidth - 280) + 'px';
      popEl.style.top = '44px';
    }
    ctxEl.classList.remove('open');
    menuEl.classList.remove('open');
    popEl.classList.add('open');
    announcePopup();
    popInput.focus();
    popInput.select();
  }
  function commitBind(value) {
    if (popTabId) window.tabStrip.send('tab-strip:set-workspace', popTabId, value);
    hideAll();
  }
  document.getElementById('wsBind').addEventListener('click', () => commitBind(popInput.value.trim() || null));
  document.getElementById('wsUnbind').addEventListener('click', () => commitBind(null));
  popInput.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') commitBind(popInput.value.trim() || null);
    if (e.key === 'Escape') hideAll();
  });

  /* ---------- ＋ 浏览器式新建菜单；⋯ 溢出设置 ---------- */
  addBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const r = addBtn.getBoundingClientRect();
    menuEl.classList.remove('open');
    ctxEl.classList.remove('open');
    popEl.classList.remove('open');
    const willOpen = !addMenuEl.classList.contains('open');
    addMenuEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 240)) + 'px';
    addMenuEl.style.top = (r.bottom + 6) + 'px';
    addMenuEl.classList.toggle('open', willOpen);
    addBtn.classList.toggle('open', willOpen);
    announcePopup();
  });
  addMenuEl.addEventListener('click', (e) => {
    const act = e.target.getAttribute('data-act');
    if (!act) return;
    hideAll();
    if (act === 'new') window.tabStrip.send('tab-strip:new');
    if (act === 'browser-current') window.tabStrip.send('tab-strip:browser-open-current');
    if (act === 'browser-new') window.tabStrip.send('tab-strip:browser-new-tab');
    if (act === 'octop') window.tabStrip.send('tab-strip:request-octop');
  });
  wHalfBtn.addEventListener('click', (e) => { e.stopPropagation(); hideAll(); window.tabStrip.send('tab-strip:browser-width', 'half'); });
  wMaxBtn.addEventListener('click', (e) => { e.stopPropagation(); hideAll(); window.tabStrip.send('tab-strip:browser-width', 'max'); });
  moreBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const r = moreBtn.getBoundingClientRect();
    menuEl.style.left = Math.max(8, r.right - 220) + 'px';
    menuEl.style.top = (r.bottom + 6) + 'px';
    ctxEl.classList.remove('open');
    popEl.classList.remove('open');
    const willOpen = !menuEl.classList.contains('open');
    menuEl.classList.toggle('open', willOpen);
    moreBtn.classList.toggle('open', willOpen);
    announcePopup();
  });
  menuEl.addEventListener('click', (e) => {
    const act = e.target.getAttribute('data-act');
    if (!act) return;
    hideAll();
    if (act === 'new') window.tabStrip.send('tab-strip:new');
    if (act === 'octop') window.tabStrip.send('tab-strip:request-octop');
  });

  window.tabStrip.on('tab-strip:state', (s) => {
    state.activeId = s.activeId;
    state.tabs = s.tabs || [];
    render();
  });
  window.tabStrip.on('browser-panel:state', (s) => {
    panelState = s;
    render();
  });

  // 初始拉取一次状态
  window.tabStrip.invoke('workspace-tabs:list').then((list) => {
    if (Array.isArray(list)) {
      state.tabs = list;
      state.activeId = (list.find((t) => t.active) || list[0] || {}).id || null;
      render();
    }
  }).catch(() => {});
  syncOctopPill();
</script>
</body>
</html>
