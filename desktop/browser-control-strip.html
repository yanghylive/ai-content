<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>浏览器面板控制条</title>
  <style>
    /* 高仿 TRAE Work 内置浏览器：深色工具条 + 地址栏胶囊 + 右侧文字按钮 + 常显 tab 行 */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body { height: 100%; overflow: hidden; }
    :root {
      --bg: #f2f3f5; --card: #ffffff; --text: #1f2329; --text-dim: #646a73;
      --text-faint: #8f959e; --border: rgba(31,35,41,.09); --hover: rgba(31,35,41,.06);
      --press: rgba(31,35,41,.10); --accent: #722ed1; --danger: #f54a45;
      --ok: #34a853; --warn: #e6a23c; --addr-bg: #ffffff; --menu-bg: #ffffff; --menu-line: rgba(31,35,41,.07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        /* TRAE Work 实测色板 */
        --bg: #16161b; --card: #1b1b21; --text: #e8e8ec; --text-dim: #a6a6b0;
        --text-faint: #77777f; --border: rgba(255,255,255,.08); --hover: rgba(255,255,255,.07);
        --press: rgba(255,255,255,.12); --accent: #a171f0; --addr-bg: #212129;
        --menu-bg: #202027; --menu-line: rgba(255,255,255,.07);
      }
    }
    body {
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--text-dim);
      font: 12px/1.4 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    /* ---- tab 行：TRAE 常显（有会话即出现），尾部 + 新建 ---- */
    #tabbar {
      display: none; flex: none; height: 26px; align-items: center; gap: 2px;
      padding: 3px 6px 0; overflow-x: auto; overflow-y: hidden;
      border-bottom: 1px solid var(--border);
    }
    #tabbar.show { display: flex; }
    #tabbar::-webkit-scrollbar { height: 0; }
    .tab {
      flex: 0 1 auto; min-width: 0; max-width: 150px; height: 23px;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 0 7px; border-radius: 6px;
      background: transparent; color: var(--text-dim); font-size: 11px; cursor: pointer;
      transition: background .12s, color .12s, box-shadow .12s;
    }
    .tab:hover { background: var(--hover); color: var(--text); }
    .tab.active { background: var(--addr-bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
    .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .x {
      flex: none; width: 14px; height: 14px; border: none; border-radius: 3px;
      background: transparent; color: var(--text-faint); font-size: 10px; line-height: 1;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      padding: 0; opacity: 0; transition: opacity .12s, background .12s, color .12s;
    }
    .tab:hover .x, .tab.active .x { opacity: 1; }
    .tab .x:hover { background: var(--press); color: var(--text); }
    #newtab {
      flex: none; width: 22px; height: 22px; margin-left: 2px; border: none; border-radius: 6px;
      background: transparent; color: var(--text-faint); font-size: 14px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    #newtab:hover { background: var(--hover); color: var(--text); }
    /* ---- 工具条 ---- */
    #toolbar {
      flex: 1 1 auto; display: flex; align-items: center; gap: 4px;
      padding: 0 8px; min-height: 0;
    }
    button {
      flex: none; width: 28px; height: 28px; border: none; border-radius: 7px;
      background: transparent; color: var(--text-dim); font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s;
    }
    button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
    button:active:not(:disabled) { background: var(--press); }
    button:disabled { opacity: 0.3; cursor: default; }
    button svg { width: 15px; height: 15px; }
    /* 地址栏胶囊：favicon 内嵌左侧 + 右侧 ⌄（最近访问） */
    #addrwrap {
      flex: 1 1 auto; min-width: 0; height: 28px; position: relative;
      display: flex; align-items: center; gap: 6px;
      background: var(--addr-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 0 4px 0 8px;
      transition: border-color .12s, box-shadow .12s;
    }
    #addrwrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(114,46,209,.14); }
    #addrwrap .fav { margin-top: 0; }
    #addr {
      flex: 1 1 auto; min-width: 0; height: 26px; border: none; background: transparent;
      color: var(--text); font-size: 12px; outline: none;
    }
    #addr::placeholder { color: var(--text-faint); }
    #recent-btn { width: 22px; height: 22px; border-radius: 5px; color: var(--text-faint); }
    #recent-btn svg { width: 12px; height: 12px; }
    #recent-btn.open { background: var(--press); color: var(--text); }
    /* 状态：TRAE 无状态文字，弱化为小圆点 + 短文字 */
    #status {
      flex: none; display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; max-width: 96px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; color: var(--text-faint);
    }
    #status .sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); flex: none; }
    #status.ready { color: var(--text-faint); } #status.ready .sdot { background: var(--ok); }
    #status.starting .sdot { background: var(--warn); animation: blink 1s ease-in-out infinite; }
    #status.needs-human .sdot, #status.blocked .sdot, #status.error .sdot { background: var(--danger); }
    #status.needs-human, #status.blocked, #status.error { color: var(--danger); }
    @keyframes blink { 50% { opacity: .35; } }
    /* 出错/被阻断：状态旁一键重试 */
    #retry {
      display: none; flex: none; width: auto; height: 20px; padding: 0 8px;
      border: 1px solid var(--danger); border-radius: 6px; background: transparent;
      color: var(--danger); font-size: 11px; font-weight: 600;
    }
    #retry.show { display: inline-flex; }
    #retry:hover { background: var(--danger); color: #fff; }
    /* 右侧文字按钮（TRAE「编辑/分享」姿态）：icon + 文字 */
    .tbtn {
      width: auto; height: 26px; padding: 0 9px; gap: 5px; border-radius: 7px;
      font-size: 11px; font-weight: 600; border: 1px solid transparent;
    }
    .tbtn svg { width: 13px; height: 13px; }
    /* ⋯ 菜单 */
    #menuwrap { position: relative; flex: none; display: flex; }
    #menu {
      display: none; position: absolute; top: 30px; right: 0; z-index: 20;
      min-width: 156px; padding: 4px; border-radius: 10px;
      background: var(--menu-bg); border: 1px solid var(--border);
      box-shadow: 0 12px 36px rgba(0,0,0,.28);
    }
    #menu.show { display: block; }
    #menu .mi {
      width: 100%; height: 28px; padding: 0 10px; border: none; border-radius: 7px;
      background: transparent; color: var(--text); font-size: 12px; font-weight: 400;
      justify-content: flex-start; gap: 8px; text-align: left;
    }
    #menu .mi:hover { background: var(--hover); }
    #menu .mi .k { margin-left: auto; color: var(--text-faint); font-size: 10px; }
    #menu .sep { height: 1px; margin: 4px 6px; background: var(--menu-line); }
    #menu .mi.danger { color: var(--danger); }
    /* 地址栏聚焦：视图加高露出快捷/建议区（独立视图防裁切） */
    #quickrow {
      display: none; flex: none; height: 30px; align-items: center; gap: 6px;
      padding: 3px 10px 5px; background: var(--card);
      border-top: 1px solid var(--border);
      overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    }
    #quickrow::-webkit-scrollbar { display: none; }
    #quickrow.show { display: flex; }
    #quickrow .lbl { font-size: 11px; color: var(--text-faint); flex: none; white-space: nowrap; }
    #quickrow .chip {
      flex: 0 0 auto; width: auto; height: 22px; padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 11px; background: var(--bg); color: var(--text-dim);
      font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      transition: all .12s; white-space: nowrap;
    }
    #quickrow .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--card); }
    /* ---- 加载进度线 ---- */
    body { position: relative; }
    #prog { position: absolute; left: 0; right: 0; top: 0; height: 2px; pointer-events: none; opacity: 0; transition: opacity .18s; z-index: 5; }
    #prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #722ed1, #b37feb); }
    #prog.on { opacity: 1; }
    #prog.on i { animation: progflow 2.2s ease-in-out infinite; }
    #prog.done { opacity: 1; }
    #prog.done i { width: 100%; transition: width .22s ease; animation: none; }
    @keyframes progflow { 0% { width: 5%; margin-left: 0; } 55% { width: 68%; } 100% { width: 78%; margin-left: 32%; opacity: .92; } }
    /* ---- 建议下拉 ---- */
    #sugbox { display: none; flex: none; background: var(--card); border-top: 1px solid var(--border); padding: 2px 6px 6px; }
    #sugbox.show { display: block; }
    #sugbox .sug {
      display: flex; align-items: center; gap: 7px; height: 24px; padding: 0 8px;
      border: none; background: transparent; color: var(--text); font-size: 11.5px;
      cursor: pointer; width: 100%; text-align: left; border-radius: 6px;
    }
    #sugbox .sug:hover { background: var(--hover); }
    #sugbox .sug .u { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    #sugbox .sug .host { flex: none; color: var(--text-faint); font-size: 10.5px; }
    #sugbox .sug.search { color: var(--accent); }
    #sugbox .sug.search .u { color: var(--accent); }
    #sugbox .empty { padding: 6px 10px; color: var(--text-faint); font-size: 11px; }
    /* ---- 面板活动条（TRAE「控制台日志」语义） ---- */
    #activityrow {
      display: none; flex: none; height: 30px; align-items: center; gap: 8px;
      padding: 0 10px; background: var(--card);
      border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim);
      cursor: pointer; overflow: hidden;
    }
    #activityrow.show { display: flex; }
    #activityrow .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    #activityrow .at { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #activityrow .ts { flex: none; font: 10px ui-monospace, Menlo, monospace; color: var(--text-faint); }
    #activityrow .n { flex: none; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
      background: var(--press); color: var(--text); font-size: 10px; display: inline-flex; align-items: center; justify-content: center; }
    #activityrow .car { flex: none; color: var(--text-faint); font-size: 10px; transition: transform .12s; }
    #activityrow.open .car { transform: rotate(180deg); }
    #activityrow:hover { background: var(--hover); }
    #activityrow .clr { flex: none; color: var(--text-faint); padding: 2px 5px; border-radius: 4px; }
    #activityrow .clr:hover { background: var(--hover); color: var(--text); }
    #activityfull {
      display: none; flex: none; max-height: 168px; overflow-y: auto;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 4px 10px 8px; font-size: 11px; color: var(--text-dim);
    }
    #activityfull.show { display: block; }
    #activityfull .line { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    #activityfull .line .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    #activityfull .line .t { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #activityfull .line .ts { margin-left: auto; flex: none; font: 10px ui-monospace, Menlo, monospace; color: var(--text-faint); }
    .fav { flex: none; width: 13px; height: 13px; border-radius: 3.5px; color: #fff;
      font-size: 8.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
      background: #8f959e; }
    /* 站点品牌色（与 tab-strip 同一映射表） */
    .fav.douyin { background: #161823; } .fav.xiaohongshu { background: #ff2442; }
    .fav.weixin { background: #07c160; } .fav.channels { background: #07c160; }
    .fav.baidu { background: #2932e1; } .fav.bilibili { background: #fb7299; }
    .fav.taobao { background: #ff5000; } .fav.jd { background: #e1251b; }
    .fav.zhihu { background: #0084ff; } .fav.github { background: #24292f; }
    .fav.kuaishou { background: #ff4906; }
    .fav.generic { background: #b9bec6; color: #fff; }
  </style>
</head>
<body>
  <div id="prog"><i></i></div>
  <div id="tabbar"></div>
  <div id="activityrow" title="最近活动 · 点击展开全部列表">
    <span class="dot" style="background:var(--text-faint)"></span>
    <span class="at"></span>
    <span class="ts"></span>
    <span class="n"></span>
    <span class="car">▾</span>
    <span class="clr">清除</span>
  </div>
  <div id="activityfull"></div>
  <div id="sugbox"></div>
  <!-- 快捷跳转行（地址栏聚焦露出） -->
  <div id="quickrow">
    <span class="lbl">快捷打开</span>
    <button type="button" class="chip" data-url="https://www.douyin.com" title="打开抖音，左侧同步切到抖音评论获客">抖音</button>
    <button type="button" class="chip" data-url="https://www.xiaohongshu.com" title="打开小红书，左侧同步切到小红书评论获客">小红书</button>
    <button type="button" class="chip" data-url="https://channels.weixin.qq.com" title="打开视频号，左侧同步切到视频号评论获客">视频号</button>
    <button type="button" class="chip" data-url="https://www.kuaishou.com/brilliant" title="打开快手网页版（精彩短视频），左侧同步切到快手评论获客">快手</button>
  </div>
  <div id="toolbar">
    <button id="back" title="后退 (⌘[)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="forward" title="前进 (⌘])"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="reload" title="重新加载 (⌘R)"><svg id="ic-reload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><svg id="ic-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div id="addrwrap">
      <span id="addrfav" class="fav generic" style="display:none"></span>
      <input id="addr" placeholder="搜索或输入网址 (⌘L)" spellcheck="false" />
      <button id="recent-btn" title="最近访问"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <span id="status"><span class="sdot"></span><span class="stxt"></span></span>
    <button id="retry" title="重新加载当前页面">重试</button>
    <div id="menuwrap">
      <button id="more" title="更多"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
      <div id="menu">
        <button class="mi" data-act="new-tab">新建标签页<span class="k">⌘T</span></button>
        <button class="mi" data-act="reload">重新加载<span class="k">⌘R</span></button>
        <button class="mi" data-act="force-reload">强制重新加载</button>
        <div class="sep"></div>
        <button class="mi" data-act="toggle-agent" id="mi-agent">AI 代操作<span class="k" id="mi-agent-k"></span></button>
        <button class="mi" data-act="control" id="mi-control" style="display:none">接管页面</button>
        <button class="mi" data-act="clear-activity">清除活动日志</button>
        <button class="mi danger" data-act="hide">收起浏览器面板</button>
      </div>
    </div>
  </div>
  <script>
    // 浏览器预览垫片：非 Electron 环境用 mock 状态渲染同一控制条（Electron 内不执行）
    if (!window.browserControl) {
      window.browserControl = {
        invoke: (channel, ...args) => { console.log('[preview mock invoke]', channel, ...args); return Promise.resolve({ success: true }); },
        onState: (cb) => {
          cb({
            canGoBack: true, canGoForward: false,
            session: { currentUrl: 'https://www.douyin.com/video/7498231...', status: 'starting' },
            agentMode: 'on', control: 'system', hasSession: true, panelWidth: 480, tabActiveIndex: 0,
            tabList: [
              { title: '抖音 · 装修视频评论区', url: 'https://www.douyin.com/video/7498231' },
              { title: '小红书 · 搜索结果', url: 'https://www.xiaohongshu.com/search' },
            ],
            activity: [
              { t: Date.now() - 4000, type: 'approve', text: '批准：Agent 点击「回复」' },
              { t: Date.now() - 16000, type: 'nav', text: '打开 https://www.douyin.com/video/7498231' },
            ],
          });
        },
      };
    }
    const api = window.browserControl;
    const $ = (id) => document.getElementById(id);
    const STATUS_LABEL = {
      starting: '加载中…', ready: '就绪', 'needs-human': '需要接管',
      blocked: '已阻断', stopped: '已收起', error: '出错',
    };

    function invoke(channel, ...args) {
      api.invoke(channel, ...args).catch(() => { /* 状态由 onState 统一刷新 */ });
    }

    /* ---- 站点 favicon ---- */
    const FAVS = [
      [/douyin\.com/, 'douyin', '抖'], [/xiaohongshu/, 'xiaohongshu', '红'],
      [/channels\.weixin/, 'channels', '视'], [/weixin\.qq/, 'weixin', '微'],
      [/mp\.weixin/, 'weixin', '微'], [/baidu\.com/, 'baidu', '百'],
      [/bilibili/, 'bilibili', 'B'], [/taobao/, 'taobao', '淘'],
      [/jd\.com/, 'jd', '京'], [/zhihu/, 'zhihu', '知'],
      [/github/, 'github', 'G'], [/kuaishou/, 'kuaishou', '快'],
    ];
    function favFor(url) {
      try {
        const host = new URL(url).hostname;
        for (const [re, key, letter] of FAVS) if (re.test(host)) return `<span class="fav ${key}">${letter}</span>`;
        const l = (host.split('.')[1] || host.replace(/^www\./, '')[0] || '网').toUpperCase().slice(0, 1) || '网';
        return `<span class="fav generic">${l}</span>`;
      } catch (e) { return ''; }
    }
    const ACT_DOT = { open: 'var(--accent)', nav: 'var(--accent)', tab: 'var(--text-faint)', approve: 'var(--ok)', reject: 'var(--danger)', hide: 'var(--text-faint)', show: 'var(--ok)', control: 'var(--warn)' };
    function fmtTime(t) {
      const d = new Date(t), p = (n) => String(n).padStart(2, '0');
      return `${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    let activityOpen = false;
    function renderActivity(list) {
      const row = $('activityrow');
      const full = $('activityfull');
      const has = Array.isArray(list) && list.length > 0;
      if (!has) activityOpen = false;
      row.classList.toggle('show', has);
      row.classList.toggle('open', has && activityOpen);
      full.classList.toggle('show', has && activityOpen);
      if (!has) { full.innerHTML = ''; return; }
      const head = list[0];
      row.querySelector('.dot').style.background = ACT_DOT[head.type] || 'var(--text-faint)';
      row.querySelector('.at').innerHTML = head.text;
      row.querySelector('.ts').textContent = fmtTime(head.t);
      row.querySelector('.n').textContent = list.length;
      full.innerHTML = '';
      for (const it of list.slice(0, 8)) {
        const div = document.createElement('div');
        div.className = 'line';
        div.innerHTML = `<span class="dot" style="background:${ACT_DOT[it.type] || 'var(--text-faint)'}"></span>`;
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = it.text;
        div.appendChild(t);
        const ts = document.createElement('span');
        ts.className = 'ts';
        ts.textContent = fmtTime(it.t);
        div.appendChild(ts);
        full.appendChild(div);
      }
    }
    $('activityrow').addEventListener('click', (e) => {
      if (e.target.classList.contains('clr')) return;
      activityOpen = !activityOpen;
      renderActivity(lastActivity || []);
      const h = activityOpen ? Math.min(170, ($('activityfull').scrollHeight || 60) + 12) : 0;
      invoke('browser-panel:expand-activity', activityOpen, h);
    });
    $('activityrow').querySelector('.clr').addEventListener('click', (e) => {
      e.stopPropagation();
      invoke('browser-panel:clear-activity');
    });
    let lastActivity = [];

    /* ---- 导航按钮：加载态 reload↔stop 切换（TRAE 体验） ---- */
    let loading = false;
    $('back').addEventListener('click', () => invoke('browser-panel:back'));
    $('forward').addEventListener('click', () => invoke('browser-panel:forward'));
    $('reload').addEventListener('click', () => {
      if (loading) invoke('browser-panel:stop');
      else invoke('browser-panel:reload');
    });
    $('retry').addEventListener('click', () => invoke('browser-panel:reload'));
    function setLoading(on) {
      loading = on;
      $('ic-reload').style.display = on ? 'none' : '';
      $('ic-stop').style.display = on ? '' : 'none';
      $('reload').title = on ? '停止加载' : '重新加载 (⌘R)';
    }
    // TRAE 对齐：接管/停用已迁到页面底部悬浮胶囊（browser-control-pill.html），
    // 工具条不再常驻这两个按钮；⋯ 菜单保留同等入口。
    /* ---- ⋯ 菜单 ---- */
    function closeMenu() { $('menu').classList.remove('show'); }
    $('more').addEventListener('click', (e) => {
      e.stopPropagation();
      $('menu').classList.toggle('show');
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('#menuwrap')) closeMenu(); });
    $('menu').addEventListener('click', (e) => {
      const mi = e.target.closest('.mi');
      if (!mi) return;
      closeMenu();
      const act = mi.getAttribute('data-act');
      if (act === 'new-tab') invoke('browser-panel:new-tab');
      else if (act === 'reload') invoke('browser-panel:reload');
      else if (act === 'force-reload') invoke('browser-panel:reload', true);
      else if (act === 'clear-activity') invoke('browser-panel:clear-activity');
      else if (act === 'hide') invoke('browser-panel:hide');
      else if (act === 'toggle-agent') invoke('browser-panel:toggle-agent-mode', !(lastState && lastState.agentMode === 'on'));
      else if (act === 'control') invoke(lastState && lastState.control === 'user' ? 'browser-panel:release-control' : 'browser-panel:take-control');
    });
    const quick = (url) => { invoke('browser-panel:navigate', url); $('addr').blur(); };
    $('quickrow').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (chip) quick(chip.getAttribute('data-url'));
    });
    /* ---- 地址栏 + 最近访问 ---- */
    $('addr').addEventListener('focus', () => {
      $('quickrow').classList.add('show');
      $('sugbox').classList.add('show');
      $('recent-btn').classList.add('open');
      renderSug();
      updateExpand();
      setTimeout(() => $('addr').select(), 0);
    });
    $('addr').addEventListener('blur', () => {
      setTimeout(() => {
        $('sugbox').classList.remove('show'); $('quickrow').classList.remove('show');
        $('recent-btn').classList.remove('open');
        invoke('browser-panel:expand-strip', false);
      }, 140);
    });
    $('recent-btn').addEventListener('pointerdown', (e) => e.preventDefault());
    $('recent-btn').addEventListener('click', () => {
      const open = $('sugbox').classList.contains('show');
      if (open && !($('addr') === document.activeElement)) { collapseExpand(); return; }
      $('addr').focus();
    });

    /* ---- 加载进度线 ---- */
    const prog = $('prog');
    let lastStatus = '';
    function setProg(status) {
      if (status === lastStatus) return;
      lastStatus = status;
      if (status === 'starting') {
        prog.classList.remove('done'); prog.classList.add('on'); setLoading(true);
      } else if (status === 'ready' || status === 'error' || status === 'blocked' || status === 'needs-human') {
        prog.classList.remove('on'); prog.classList.add('done'); setLoading(false);
        setTimeout(() => { prog.classList.remove('done', 'on'); }, 420);
      } else {
        prog.classList.remove('on', 'done'); setLoading(false);
      }
    }

    /* ---- 最近访问 + 建议 ---- */
    let recentUrls = [];
    function collectRecents(state) {
      const out = [];
      for (const a of state.activity || []) {
        if (a.type === 'nav' && a.text.startsWith('打开 ')) {
          const url = a.text.slice(3);
          try {
            const host = new URL(url).hostname;
            if (!out.some((u) => new URL(u).hostname === host)) out.push(url);
          } catch (e) { /* 跳过非法 URL */ }
        }
      }
      recentUrls = out.slice(0, 6);
    }
    function renderSug() {
      const box = $('sugbox');
      const q = $('addr').value.trim();
      box.innerHTML = '';
      const lower = q.toLowerCase();
      if (!q) {
        // 空输入：展示最近访问列表（TRAE ⌄ 下拉语义）
        if (!recentUrls.length) {
          box.innerHTML = '<div class="empty">输入网址直接打开 · 输入关键词走百度搜索</div>';
          return;
        }
        for (const url of recentUrls) {
          const row = document.createElement('button');
          row.type = 'button'; row.className = 'sug';
          row.insertAdjacentHTML('afterbegin', favFor(url));
          const u = document.createElement('span');
          u.className = 'u'; u.textContent = url;
          row.appendChild(u);
          try { const hh = document.createElement('span'); hh.className = 'host'; hh.textContent = new URL(url).hostname; row.appendChild(hh); } catch (e) {}
          row.onclick = () => { $('addr').value = url; quick(url); };
          box.appendChild(row);
        }
        return;
      }
      const matched = recentUrls.filter((u) => u.toLowerCase().includes(lower)).slice(0, 4);
      if (!matched.length) {
        const row = document.createElement('button');
        row.type = 'button'; row.className = 'sug search';
        row.innerHTML = '<span class="u">搜索「' + q.replace(/[<>&"]/g, '') + '」</span><span class="host">百度</span>';
        row.onclick = () => quick('https://www.baidu.com/s?wd=' + encodeURIComponent(q));
        box.appendChild(row);
      } else {
        for (const url of matched) {
          const row = document.createElement('button');
          row.type = 'button'; row.className = 'sug';
          row.insertAdjacentHTML('afterbegin', favFor(url));
          const u = document.createElement('span');
          u.className = 'u'; u.textContent = url;
          row.appendChild(u);
          try { const hh = document.createElement('span'); hh.className = 'host'; hh.textContent = new URL(url).hostname; row.appendChild(hh); } catch (e) {}
          row.onclick = () => { $('addr').value = url; quick(url); };
          box.appendChild(row);
        }
      }
    }
    function updateExpand() {
      const sugH = $('sugbox').scrollHeight || 0;
      const need = 32 + sugH;
      invoke('browser-panel:expand-strip', true, Math.min(160, need));
    }
    function collapseExpand() {
      $('sugbox').classList.remove('show');
      $('quickrow').classList.remove('show');
      $('recent-btn').classList.remove('open');
      invoke('browser-panel:expand-strip', false);
    }
    $('addr').addEventListener('input', () => { renderSug(); updateExpand(); });
    $('addr').addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { event.target.blur(); return; }
      if (event.key !== 'Enter') return;
      const raw = $('addr').value.trim();
      if (!raw) return;
      renderSug();
      const first = $('sugbox').querySelector('.sug');
      if (first && first.onclick) { first.onclick(); return; }
      const url = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw) ? raw : `https://${raw}`;
      quick(url);
    });
    const keepFocus = (e) => { if (!e.target.closest('input')) e.preventDefault(); };
    $('sugbox').addEventListener('pointerdown', keepFocus);
    $('quickrow').addEventListener('pointerdown', keepFocus);

    /* ---- 快捷键（TRAE 体验）：⌘L 地址栏 / ⌘R 刷新 / ⌘[ ] 前后退 / ⌘T 新标签 ---- */
    document.addEventListener('keydown', (e) => {
      const meta = e.metaKey || e.ctrlKey;
      if (!meta) {
        if (e.key === 'Escape') { closeMenu(); collapseExpand(); }
        return;
      }
      const k = e.key.toLowerCase();
      if (k === 'l') { e.preventDefault(); $('addr').focus(); }
      else if (k === 'r') { e.preventDefault(); invoke('browser-panel:reload'); }
      else if (k === 't') { e.preventDefault(); invoke('browser-panel:new-tab'); }
      else if (k === '[') { e.preventDefault(); if (!$('back').disabled) invoke('browser-panel:back'); }
      else if (k === ']') { e.preventDefault(); if (!$('forward').disabled) invoke('browser-panel:forward'); }
    });

    /* ---- tab 行：多 tab 显示（单 tab 零干扰），尾部新建按钮 ---- */
    function renderTabbar(state) {
      const bar = $('tabbar');
      const list = Array.isArray(state.tabList) ? state.tabList : [];
      if (!state.hasSession || list.length < 2) {
        bar.classList.remove('show');
        bar.innerHTML = '';
        return;
      }
      bar.classList.add('show');
      bar.innerHTML = '';
      list.forEach((tab, i) => {
        const el = document.createElement('div');
        el.className = 'tab' + (i === state.tabActiveIndex ? ' active' : '');
        el.title = tab.url || '';
        el.insertAdjacentHTML('afterbegin', favFor(tab.url || ''));
        const label = document.createElement('span');
        label.className = 't';
        label.textContent = tab.title || tab.url || '空白页';
        el.appendChild(label);
        if (list.length > 1) {
          const x = document.createElement('button');
          x.className = 'x';
          x.textContent = '✕';
          x.title = '关闭此标签页';
          x.addEventListener('click', (event) => {
            event.stopPropagation();
            invoke('browser-panel:close-tab', i);
          });
          el.appendChild(x);
        }
        el.addEventListener('click', () => invoke('browser-panel:switch-tab', i));
        bar.appendChild(el);
      });
      const plus = document.createElement('button');
      plus.id = 'newtab';
      plus.title = '新建标签页 (⌘T)';
      plus.textContent = '+';
      plus.addEventListener('click', () => invoke('browser-panel:new-tab'));
      bar.appendChild(plus);
    }

    let lastState = null;
    api.onState((state) => {
      lastState = state;
      const session = state.session;
      $('back').disabled = !state.canGoBack;
      $('forward').disabled = !state.canGoForward;
      const url = session && session.currentUrl ? session.currentUrl : '';
      if (document.activeElement !== $('addr')) {
        $('addr').value = url;
      }
      // 地址栏 favicon
      const fav = $('addrfav');
      if (url && url !== 'about:blank') {
        fav.style.display = '';
        fav.outerHTML = favFor(url).replace('<span class="fav', '<span id="addrfav" class="fav');
      } else {
        fav.style.display = 'none';
      }
      const status = $('status');
      const s = session ? session.status : '';
      status.querySelector('.stxt').textContent = STATUS_LABEL[s] || (s ? s : '');
      status.className = s || '';
      $('retry').classList.toggle('show', s === 'error' || s === 'blocked');
      const agentOn = state.agentMode === 'on';
      const userCtrl = state.control === 'user';
      // ⋯ 菜单跟随：AI 代操作勾选态；接管/交还项只在 AI 开启时露面
      $('mi-agent-k').textContent = agentOn ? '✓' : '';
      const miCtrl = $('mi-control');
      miCtrl.style.display = agentOn ? '' : 'none';
      miCtrl.textContent = userCtrl ? '交还 AI 控制权' : '接管页面';
      renderTabbar(state);
      lastActivity = Array.isArray(state.activity) ? state.activity : [];
      renderActivity(lastActivity);
      collectRecents(state);
      setProg(s);
      if (document.activeElement === $('addr')) renderSug();
    });
  </script>
</body>
</html>
