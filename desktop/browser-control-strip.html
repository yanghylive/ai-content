<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>浏览器面板控制条</title>
  <style>
    /* 对齐 tab-strip 深色工具条姿态：紧凑、不抢视觉 */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      background: #1e1f24; color: #d7d9e0;
      font: 12px/1.4 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      border-top: 1px solid #2c2d34;
    }
    /* round15：tab 条行——多 tab 时才显示（单 tab 零干扰，控制条一行不变） */
    #tabbar {
      display: none; flex: none; height: 26px; align-items: center; gap: 2px;
      padding: 2px 6px 0; overflow-x: auto; overflow-y: hidden;
      border-bottom: 1px solid #2c2d34;
    }
    #tabbar.show { display: flex; }
    .tab {
      flex: 0 1 auto; min-width: 0; max-width: 150px; height: 22px;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 0 6px; border-radius: 5px 5px 0 0;
      background: transparent; color: #aeb1bc; font-size: 11px; cursor: pointer;
      border: none; border-bottom: 2px solid transparent;
    }
    .tab:hover { background: #2c2d34; }
    .tab.active { background: #2c2d34; color: #eef0f6; border-bottom-color: #722ed1; }
    .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .x {
      flex: none; width: 14px; height: 14px; border: none; border-radius: 3px;
      background: transparent; color: #8a8d98; font-size: 10px; line-height: 1;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .tab .x:hover { background: #3a3b44; color: #ff6b6d; }
    #toolbar {
      flex: 1 1 auto; display: flex; align-items: center; gap: 6px;
      padding: 0 8px; min-height: 0;
    }
    button {
      flex: none; width: 26px; height: 26px; border: none; border-radius: 6px;
      background: transparent; color: #aeb1bc; font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    button:hover:not(:disabled) { background: #2c2d34; color: #eef0f6; }
    button:disabled { opacity: 0.35; cursor: default; }
    #addr {
      flex: 1 1 auto; min-width: 0; height: 26px;
      background: #2a2b31; border: 1px solid #34353d; border-radius: 6px;
      color: #e8eaf0; font-size: 12px; padding: 0 8px;
      outline: none;
    }
    #addr:focus { border-color: #722ed1; }
    #status {
      flex: none; font-size: 11px; max-width: 84px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; color: #8a8d98;
    }
    #status.ready { color: #52c41a; }
    #status.starting { color: #faad14; }
    #status.needs-human, #status.blocked, #status.error { color: #ff4d4f; }
    /* ③：AI 代操作开关——开着时主题紫高亮（与主色 #722ed1 对齐） */
    #agent-mode { width: auto; padding: 0 8px; font-size: 11px; }
    #agent-mode.on { background: #722ed1; color: #fff; }
    #agent-mode.on:hover { background: #8a48e0; }
    #resize { flex: none; width: 5px; height: 100%; cursor: ew-resize; background: #34353d; }
    #resize:hover { background: #722ed1; }
  </style>
</head>
<body>
  <div id="tabbar"></div>
  <div id="toolbar">
    <div id="resize" title="拖拽调整面板宽度"></div>
    <button id="back" title="后退">‹</button>
    <button id="forward" title="前进">›</button>
    <button id="reload" title="刷新">↻</button>
    <input id="addr" placeholder="输入网址，回车打开" spellcheck="false" />
    <span id="status"></span>
    <button id="agent-mode" title="AI 代操作：开启后 AI 助手将在你正在看的这个页面上代你操作（每一步写动作仍需你在此面板批准）">AI 代操作</button>
    <button id="hide" title="收起面板">✕</button>
  </div>
  <script>
    const api = window.browserControl;
    const $ = (id) => document.getElementById(id);
    const STATUS_LABEL = {
      starting: '加载中…', ready: '就绪', 'needs-human': '需要接管',
      blocked: '已阻断', stopped: '已收起', error: '出错',
    };

    function invoke(channel, ...args) {
      api.invoke(channel, ...args).catch(() => { /* 状态由 onState 统一刷新 */ });
    }

    $('back').addEventListener('click', () => invoke('browser-panel:back'));
    $('forward').addEventListener('click', () => invoke('browser-panel:forward'));
    $('reload').addEventListener('click', () => invoke('browser-panel:reload'));
    $('hide').addEventListener('click', () => invoke('browser-panel:hide'));
    // ③：开关切换（回读态由 onState 里的 agentMode 统一刷新，不自说自话）
    $('agent-mode').addEventListener('click', () => {
      invoke('browser-panel:toggle-agent-mode', !(lastState && lastState.agentMode === 'on'));
    });
    $('addr').addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      const raw = $('addr').value.trim();
      if (!raw) return;
      const url = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw) ? raw : `https://${raw}`;
      invoke('browser-panel:navigate', url);
      $('addr').blur();
    });

    // round15：tab 条（用户手动切/关；面板只暴露自己的页面，无第三方 IPC 特权）
    function renderTabbar(state) {
      const bar = $('tabbar');
      const list = Array.isArray(state.tabList) ? state.tabList : [];
      if (!state.hasSession || list.length < 2) {
        bar.classList.remove('show');
        bar.innerHTML = '';
        return;
      }
      bar.classList.add('show');
      bar.innerHTML = '';
      list.forEach((tab, i) => {
        const el = document.createElement('div');
        el.className = 'tab' + (i === state.tabActiveIndex ? ' active' : '');
        el.title = tab.url || '';
        const label = document.createElement('span');
        label.className = 't';
        label.textContent = tab.title || tab.url || '空白页';
        el.appendChild(label);
        // 最后一个 tab 不显示关闭（面板至少保留一个页面）
        if (list.length > 1) {
          const x = document.createElement('button');
          x.className = 'x';
          x.textContent = '✕';
          x.title = '关闭此标签页';
          x.addEventListener('click', (event) => {
            event.stopPropagation();
            invoke('browser-panel:close-tab', i);
          });
          el.appendChild(x);
        }
        el.addEventListener('click', () => invoke('browser-panel:switch-tab', i));
        bar.appendChild(el);
      });
    }

    // 左缘拖拽调宽（面板在右，向左拖变宽）
    let dragStartX = null;
    let dragStartWidth = null;
    $('resize').addEventListener('pointerdown', (event) => {
      dragStartX = event.clientX;
      dragStartWidth = lastState?.panelWidth || 480;
      $('resize').setPointerCapture(event.pointerId);
    });
    $('resize').addEventListener('pointermove', (event) => {
      if (dragStartX == null) return;
      const next = dragStartWidth + (dragStartX - event.clientX);
      invoke('browser-panel:set-width', next);
    });
    $('resize').addEventListener('pointerup', () => { dragStartX = null; });

    let lastState = null;
    api.onState((state) => {
      lastState = state;
      const session = state.session;
      $('back').disabled = !state.canGoBack;
      $('forward').disabled = !state.canGoForward;
      if (document.activeElement !== $('addr')) {
        $('addr').value = session && session.currentUrl ? session.currentUrl : '';
      }
      const status = $('status');
      const s = session ? session.status : '';
      status.textContent = STATUS_LABEL[s] || (s ? s : '');
      status.className = s || '';
      // ③：AI 代操作开关态（publicState.agentMode 驱动高亮）
      const agentOn = state.agentMode === 'on';
      $('agent-mode').classList.toggle('on', agentOn);
      // round15：tab 条（tabList/tabActiveIndex 驱动，多 tab 才出现）
      renderTabbar(state);
    });
  </script>
</body>
</html>
