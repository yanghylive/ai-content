<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>浏览器面板控制条</title>
  <style>
    /* 大厂质感: 与 tab-strip 同一套中性 token(浅色, 深色自动适配) */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body { height: 100%; overflow: hidden; }
    :root {
      --bg: #f2f3f5; --card: #ffffff; --text: #1f2329; --text-dim: #646a73;
      --text-faint: #8f959e; --border: rgba(31,35,41,.09); --hover: rgba(31,35,41,.06);
      --press: rgba(31,35,41,.10); --accent: #722ed1; --danger: #f54a45;
      --ok: #34a853; --warn: #e6a23c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a; --card: #23242a; --text: #f2f3f5; --text-dim: #bbbfc4;
        --text-faint: #8f959e; --border: rgba(255,255,255,.10); --hover: rgba(255,255,255,.08);
        --press: rgba(255,255,255,.13); --accent: #a171f0;
      }
    }
    body {
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--text-dim);
      font: 12px/1.4 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      border-top: 1px solid var(--border);
    }
    /* round15：tab 条行——多 tab 时才显示（单 tab 零干扰，控制条一行不变） */
    #tabbar {
      display: none; flex: none; height: 28px; align-items: center; gap: 2px;
      padding: 3px 6px 0; overflow-x: auto; overflow-y: hidden;
      border-bottom: 1px solid var(--border);
    }
    #tabbar.show { display: flex; }
    #tabbar::-webkit-scrollbar { height: 0; }
    .tab {
      flex: 0 1 auto; min-width: 0; max-width: 160px; height: 25px;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 0 7px; border-radius: 6px;
      background: transparent; color: var(--text-dim); font-size: 11px; cursor: pointer;
      transition: background .12s, color .12s, box-shadow .12s;
    }
    .tab:hover { background: var(--hover); color: var(--text); }
    .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
    .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .x {
      flex: none; width: 14px; height: 14px; border: none; border-radius: 3px;
      background: transparent; color: var(--text-faint); font-size: 10px; line-height: 1;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      padding: 0; opacity: 0; transition: opacity .12s, background .12s, color .12s;
    }
    .tab:hover .x, .tab.active .x { opacity: 1; }
    .tab .x:hover { background: var(--press); color: var(--text); }
    #toolbar {
      flex: 1 1 auto; display: flex; align-items: center; gap: 4px;
      padding: 0 8px; min-height: 0;
    }
    button {
      flex: none; width: 28px; height: 28px; border: none; border-radius: 7px;
      background: transparent; color: var(--text-dim); font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s;
    }
    button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
    button:active:not(:disabled) { background: var(--press); }
    button:disabled { opacity: 0.3; cursor: default; }
    button svg { width: 15px; height: 15px; }
    #addr {
      flex: 1 1 auto; min-width: 0; height: 28px;
      background: var(--card); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-size: 12px; padding: 0 10px;
      outline: none; transition: border-color .12s, box-shadow .12s;
    }
    #addr:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(114,46,209,.12); }
    #status {
      flex: none; font-size: 11px; max-width: 84px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; color: var(--text-faint);
    }
    #status.ready { color: var(--ok); }
    #status.starting { color: var(--warn); }
    #status.needs-human, #status.blocked, #status.error { color: var(--danger); }
    /* ③：AI 代操作开关——开着主色实底，平时幽灵 */
    #agent-mode { width: auto; padding: 0 10px; font-size: 11px; font-weight: 600; }
    #agent-mode.on { background: var(--accent); color: #fff; }
    #agent-mode.on:hover { background: var(--accent); filter: brightness(1.08); }
    /* TraeWork 对齐：地址栏聚焦时控制器视图加高 30px，露出快捷跳转行
       （控制条是独立视图，下拉会被视图边界裁掉，故用"视图加高"实现） */
    #quickrow {
      display: none; flex: none; height: 30px; align-items: center; gap: 6px;
      padding: 3px 10px 5px; background: var(--card);
      border-top: 1px solid var(--border);
    }
    #quickrow.show { display: flex; }
    #quickrow .lbl { font-size: 11px; color: var(--text-faint); flex: none; }
    #quickrow .chip {
      flex: none; height: 22px; padding: 0 10px; border: 1px solid var(--border);
      border-radius: 11px; background: var(--bg); color: var(--text-dim);
      font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      transition: all .12s;
    }
    #quickrow .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--card); }
    #quickrow .chip .k { font: 10px ui-monospace, Menlo, monospace; opacity: .55; }
    /* ---- 面板活动条（TraeWork「控制台日志」语义） ---- */
    #activityrow {
      display: none; flex: none; height: 30px; align-items: center; gap: 8px;
      padding: 0 10px; background: var(--card);
      border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim);
      cursor: pointer; overflow: hidden;
    }
    #activityrow.show { display: flex; }
    #activityrow .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    #activityrow .at { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #activityrow .at b { color: var(--text); font-weight: 600; }
    #activityrow .ts { flex: none; font: 10px ui-monospace, Menlo, monospace; color: var(--text-faint); }
    #activityrow .n { flex: none; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
      background: var(--press); color: var(--text); font-size: 10px; display: inline-flex; align-items: center; justify-content: center; }
    #activityrow .clr { flex: none; color: var(--text-faint); padding: 2px 5px; border-radius: 4px; }
    #activityrow .clr:hover { background: var(--hover); color: var(--text); }
    #activityfull {
      display: none; flex: none; max-height: 168px; overflow-y: auto;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 4px 10px 8px; font-size: 11px; color: var(--text-dim);
    }
    #activityfull.show { display: block; }
    #activityfull .line { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    #activityfull .line .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    #activityfull .line .t { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #activityfull .line .ts { margin-left: auto; flex: none; font: 10px ui-monospace, Menlo, monospace; color: var(--text-faint); }
    .fav { flex: none; width: 13px; height: 13px; border-radius: 3.5px; color: #fff;
      font-size: 8.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
      background: #8f959e; }
    /* 站点品牌色（与 tab-strip 同一映射表） */
    .fav.douyin { background: #161823; } .fav.xiaohongshu { background: #ff2442; }
    .fav.weixin { background: #07c160; } .fav.channels { background: #07c160; }
    .fav.baidu { background: #2932e1; } .fav.bilibili { background: #fb7299; }
    .fav.taobao { background: #ff5000; } .fav.jd { background: #e1251b; }
    .fav.zhihu { background: #0084ff; } .fav.github { background: #24292f; }
    .fav.generic { background: #b9bec6; color: #fff; }
  </style>
</head>
<body>
  <div id="tabbar"></div>
  <div id="activityrow" title="最近活动（点击展开全部）">
    <span class="dot" style="background:var(--text-faint)"></span>
    <span class="at"></span>
    <span class="ts"></span>
    <span class="n"></span>
    <span class="clr">清除</span>
  </div>
  <div id="activityfull"></div>
  <div id="quickrow">
    <span class="lbl">快捷打开</span>
    <button type="button" class="chip" data-url="https://www.douyin.com">抖音</button>
    <button type="button" class="chip" data-url="https://www.xiaohongshu.com">小红书</button>
    <button type="button" class="chip" data-url="https://mp.weixin.qq.com">公众号</button>
    <button type="button" class="chip" data-url="https://channels.weixin.qq.com">视频号</button>
    <button type="button" class="chip" data-url="https://www.baidu.com">百度<span class="k">⌥A</span></button>
  </div>
  <div id="toolbar">
    <button id="back" title="后退"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="forward" title="前进"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="reload" title="刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <input id="addr" placeholder="输入网址，回车打开" spellcheck="false" />
    <span id="status"></span>
    <button id="agent-mode" title="AI 代操作：开启后 AI 助手将在你正在看的这个页面上代你操作（每一步写动作仍需你在此面板批准）">AI 代操作</button>
    <button id="hide" title="收起面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <script>
    // 浏览器预览垫片：非 Electron 环境用 mock 状态渲染同一控制条（Electron 内不执行）
    if (!window.browserControl) {
      window.browserControl = {
        invoke: (channel, ...args) => { console.log('[preview mock invoke]', channel, ...args); return Promise.resolve({ success: true }); },
        onState: (cb) => {
          cb({
            canGoBack: true, canGoForward: false,
            session: { currentUrl: 'https://www.douyin.com/video/7498231...', status: 'ready' },
            agentMode: 'off', hasSession: true, panelWidth: 480, tabActiveIndex: 0,
            tabList: [
              { title: '抖音 · 装修视频评论区', url: 'https://www.douyin.com/video/7498231' },
              { title: '小红书 · 搜索结果', url: 'https://www.xiaohongshu.com/search' },
            ],
            activity: [
              { t: Date.now() - 4000, type: 'approve', text: '批准：Agent 点击「回复」' },
              { t: Date.now() - 16000, type: 'nav', text: '打开 https://www.douyin.com/video/7498231' },
            ],
          });
        },
      };
    }
    const api = window.browserControl;
    const $ = (id) => document.getElementById(id);
    const STATUS_LABEL = {
      starting: '加载中…', ready: '就绪', 'needs-human': '需要接管',
      blocked: '已阻断', stopped: '已收起', error: '出错',
    };

    function invoke(channel, ...args) {
      api.invoke(channel, ...args).catch(() => { /* 状态由 onState 统一刷新 */ });
    }

    /* ---- 站点 favicon（内置品牌映射：host → {key, letter}，未知走首字母灰色块） ---- */
    const FAVS = [
      [/douyin\.com/, 'douyin', '抖'], [/xiaohongshu/, 'xiaohongshu', '红'],
      [/channels\.weixin/, 'channels', '视'], [/weixin\.qq/, 'weixin', '微'],
      [/mp\.weixin/, 'weixin', '微'], [/baidu\.com/, 'baidu', '百'],
      [/bilibili/, 'bilibili', 'B'], [/taobao/, 'taobao', '淘'],
      [/jd\.com/, 'jd', '京'], [/zhihu/, 'zhihu', '知'],
      [/github/, 'github', 'G'],
    ];
    function favFor(url) {
      try {
        const host = new URL(url).hostname;
        for (const [re, key, letter] of FAVS) if (re.test(host)) return `<span class="fav ${key}">${letter}</span>`;
        const l = (host.split('.')[1] || host.replace(/^www\./, '')[0] || '网').toUpperCase().slice(0, 1) || '网';
        return `<span class="fav generic">${l}</span>`;
      } catch (e) { return ''; }
    }
    const ACT_DOT = { open: 'var(--accent)', nav: 'var(--accent)', tab: 'var(--text-faint)', approve: 'var(--ok)', reject: 'var(--danger)', hide: 'var(--text-faint)', show: 'var(--ok)' };
    function fmtTime(t) {
      const d = new Date(t), p = (n) => String(n).padStart(2, '0');
      return `${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    let activityOpen = false;
    function renderActivity(list) {
      const row = $('activityrow');
      const full = $('activityfull');
      const has = Array.isArray(list) && list.length > 0;
      row.classList.toggle('show', has);
      full.classList.toggle('show', has && activityOpen);
      if (!has) { full.innerHTML = ''; return; }
      const head = list[0];
      const dotEl = row.querySelector('.dot');
      dotEl.style.background = ACT_DOT[head.type] || 'var(--text-faint)';
      row.querySelector('.at').innerHTML = head.text;
      row.querySelector('.ts').textContent = fmtTime(head.t);
      row.querySelector('.n').textContent = list.length;
      full.innerHTML = '';
      for (const it of list.slice(0, 8)) {
        const div = document.createElement('div');
        div.className = 'line';
        div.innerHTML = `<span class="dot" style="background:${ACT_DOT[it.type] || 'var(--text-faint)'}"></span>`;
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = it.text;
        div.appendChild(t);
        const ts = document.createElement('span');
        ts.className = 'ts';
        ts.textContent = fmtTime(it.t);
        div.appendChild(ts);
        full.appendChild(div);
      }
    }
    $('activityrow').addEventListener('click', (e) => {
      if (e.target.classList.contains('clr')) return;
      activityOpen = !activityOpen;
      renderActivity(lastActivity || []);
    });
    $('activityrow').querySelector('.clr').addEventListener('click', (e) => {
      e.stopPropagation();
      invoke('browser-panel:clear-activity');
    });
    let lastActivity = [];

    $('back').addEventListener('click', () => invoke('browser-panel:back'));
    $('forward').addEventListener('click', () => invoke('browser-panel:forward'));
    $('reload').addEventListener('click', () => invoke('browser-panel:reload'));
    $('hide').addEventListener('click', () => invoke('browser-panel:hide'));
    // ③：开关切换（回读态由 onState 里的 agentMode 统一刷新，不自说自话）
    $('agent-mode').addEventListener('click', () => {
      invoke('browser-panel:toggle-agent-mode', !(lastState && lastState.agentMode === 'on'));
    });
    const quick = (url) => { invoke('browser-panel:navigate', url); $('addr').blur(); };
    $('quickrow').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (chip) quick(chip.getAttribute('data-url'));
    });
    $('addr').addEventListener('focus', () => {
      $('quickrow').classList.add('show');
      $('addr').select();
    });
    $('addr').addEventListener('blur', () => {
      setTimeout(() => $('quickrow').classList.remove('show'), 120);
    });
    $('addr').addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      const raw = $('addr').value.trim();
      if (!raw) return;
      const url = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw) ? raw : `https://${raw}`;
      invoke('browser-panel:navigate', url);
      $('addr').blur();
    });

    // round15：tab 条（用户手动切/关；面板只暴露自己的页面，无第三方 IPC 特权）
    function renderTabbar(state) {
      const bar = $('tabbar');
      const list = Array.isArray(state.tabList) ? state.tabList : [];
      if (!state.hasSession || list.length < 2) {
        bar.classList.remove('show');
        bar.innerHTML = '';
        return;
      }
      bar.classList.add('show');
      bar.innerHTML = '';
      list.forEach((tab, i) => {
        const el = document.createElement('div');
        el.className = 'tab' + (i === state.tabActiveIndex ? ' active' : '');
        el.title = tab.url || '';
        el.insertAdjacentHTML('afterbegin', favFor(tab.url || ''));
        const label = document.createElement('span');
        label.className = 't';
        label.textContent = tab.title || tab.url || '空白页';
        el.appendChild(label);
        // 最后一个 tab 不显示关闭（面板至少保留一个页面）
        if (list.length > 1) {
          const x = document.createElement('button');
          x.className = 'x';
          x.textContent = '✕';
          x.title = '关闭此标签页';
          x.addEventListener('click', (event) => {
            event.stopPropagation();
            invoke('browser-panel:close-tab', i);
          });
          el.appendChild(x);
        }
        el.addEventListener('click', () => invoke('browser-panel:switch-tab', i));
        bar.appendChild(el);
      });
    }

    let lastState = null;
    api.onState((state) => {
      lastState = state;
      const session = state.session;
      $('back').disabled = !state.canGoBack;
      $('forward').disabled = !state.canGoForward;
      if (document.activeElement !== $('addr')) {
        $('addr').value = session && session.currentUrl ? session.currentUrl : '';
      }
      const status = $('status');
      const s = session ? session.status : '';
      status.textContent = STATUS_LABEL[s] || (s ? s : '');
      status.className = s || '';
      // ③：AI 代操作开关态（publicState.agentMode 驱动高亮）
      const agentOn = state.agentMode === 'on';
      $('agent-mode').classList.toggle('on', agentOn);
      // round15：tab 条（tabList/tabActiveIndex 驱动，多 tab 才出现）
      renderTabbar(state);
      // 面板活动条（publicState.activity 驱动）
      lastActivity = Array.isArray(state.activity) ? state.activity : [];
      if (activityOpen) renderActivity(lastActivity);
      else renderActivity(lastActivity);
    });
  </script>
</body>
</html>
