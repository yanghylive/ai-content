<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>动作审批</title>
  <style>
    /* 大厂质感: 浅色卡片(同控制条 token), 深色自动适配 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    :root {
      --bg: #ffffff; --soft: #f7f8fa; --text: #1f2329; --text-dim: #646a73;
      --text-faint: #8f959e; --border: rgba(31,35,41,.09); --hover: rgba(31,35,41,.06);
      --accent: #722ed1; --warn: #e6a23c;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #23242a; --soft: #2a2b32; --text: #f2f3f5; --text-dim: #bbbfc4; --text-faint: #8f959e; --border: rgba(255,255,255,.10); --hover: rgba(255,255,255,.08); --accent: #a171f0; }
    }
    body {
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font: 12px/1.45 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(31,35,41,.16), 0 2px 6px rgba(31,35,41,.08);
      -webkit-user-select: none; user-select: none;
      overflow: hidden;
    }
    #head {
      flex: none; height: 36px; display: flex; align-items: center; gap: 7px;
      padding: 0 12px; background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; box-shadow: 0 0 0 3px rgba(230,162,60,.15); }
    #title { font-size: 12.5px; font-weight: 600; color: var(--text); }
    #count {
      font-size: 11px; color: var(--text-dim); margin-left: auto; flex: none;
      background: var(--soft); border: 1px solid var(--border);
      border-radius: 10px; padding: 1px 8px; font-weight: 600;
    }
    #list { flex: 1 1 auto; overflow-y: auto; padding: 8px; }
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .card {
      min-height: 64px; display: flex; align-items: center; gap: 8px;
      padding: 8px; margin-bottom: 6px;
      background: var(--soft); border: 1px solid var(--border); border-radius: 8px;
      transition: border-color .12s;
    }
    .card:last-child { margin-bottom: 0; }
    .card:hover { border-color: var(--text-faint); }
    .info { flex: 1 1 auto; min-width: 0; overflow: hidden; }
    .what {
      font-size: 12px; color: var(--text); font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .where {
      font-size: 11px; color: var(--text-faint); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ops { flex: none; display: flex; gap: 6px; }
    button {
      height: 26px; padding: 0 12px; border-radius: 6px;
      font-size: 12px; cursor: pointer; white-space: nowrap;
      font-family: inherit; transition: filter .12s, background .12s;
    }
    .ok { background: var(--accent); color: #fff; border: none; font-weight: 600; }
    .ok:hover { filter: brightness(1.08); }
    .no { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .no:hover { background: var(--hover); color: var(--text); }
    button:disabled { opacity: 0.45; cursor: default; }
    .empty { padding: 14px 10px; color: var(--text-faint); text-align: center; }

  </style>
</head>
<body>
  <div id="head">
    <span id="dot"></span>
    <span id="title">Agent 请求操作这个页面</span>
    <span id="count">0</span>
  </div>
  <div id="list"></div>
  <script>
    // 浏览器预览垫片：非 Electron 环境 mock 两条待批准动作（Electron 内不执行）
    if (!window.browserApproval) {
      const MOCK_PENDING = { actions: [
          { actionId: 'a1', method: 'Input.dispatchMouseEvent', summary: { label: '点击「回复」按钮' }, binding: { url: 'https://www.douyin.com/video/7498231', webContentsId: 7 } },
          { actionId: 'a2', method: 'Input.insertText', summary: { text: '你好，看到你关注装修，我们正好在做这个…' }, binding: { url: 'https://www.douyin.com/video/7498231', webContentsId: 7 } },
        ] };
      window.browserApproval = {
        invoke: (channel, id) => {
          console.log('[preview mock invoke]', channel, id);
          if (channel === 'browser-panel:list-pending-actions') return Promise.resolve(MOCK_PENDING);
          return Promise.resolve({ success: true });
        },
        onPendingActions: (cb) => cb(MOCK_PENDING),
      };
    }
    // ⚠️ 安全：整个界面只用 textContent 写入，绝不拼 innerHTML。
    // 卡片里的动作名/网址/摘要全部由 Agent 侧提供（不可信输入），
    // 拼 HTML 就等于给 Agent 一个往本地受信视图里注入脚本的口子。
    const api = window.browserApproval;
    const $ = (id) => document.getElementById(id);

    const METHOD_LABEL = {
      'Page.navigate': '打开网页',
      'Input.dispatchMouseEvent': '鼠标点击',
      'Input.dispatchKeyEvent': '键盘输入',
      'Input.insertText': '输入文字',
    };

    function describe(action) {
      const label = METHOD_LABEL[action.method] || action.method;
      const s = action.summary || {};
      const detail =
        s.label || s.text || s.selector || s.url || s.targetLabel || '';
      return detail ? label + '：' + detail : label;
    }

    function where(action) {
      const url = (action.binding && action.binding.url) || '';
      const wc = action.binding && action.binding.webContentsId;
      return wc ? url + '  ·  页面 #' + wc : url;
    }

    function render(payload) {
      const actions = (payload && payload.actions) || [];
      $('count').textContent = String(actions.length);
      const list = $('list');
      list.textContent = '';
      if (!actions.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '暂无待批准的动作';
        list.appendChild(empty);
        return;
      }
      actions.forEach((action) => {
        const card = document.createElement('div');
        card.className = 'card';

        const info = document.createElement('div');
        info.className = 'info';
        const what = document.createElement('div');
        what.className = 'what';
        what.textContent = describe(action);
        const whereEl = document.createElement('div');
        whereEl.className = 'where';
        whereEl.textContent = where(action);
        whereEl.title = where(action);
        info.appendChild(what);
        info.appendChild(whereEl);

        const ops = document.createElement('div');
        ops.className = 'ops';
        const ok = document.createElement('button');
        ok.className = 'ok';
        ok.textContent = '批准';
        ok.title = '允许 Agent 在当前页面执行这个动作';
        const no = document.createElement('button');
        no.className = 'no';
        no.textContent = '拒绝';
        no.title = '拒绝后该动作不能再执行（Agent 需重新申请）';

        const act = (channel, kind) => {
          ok.disabled = true;
          no.disabled = true;
          api.invoke(channel, action.actionId)
            .then(() => {
              // 批准/拒绝后由主进程推送新列表，这里不本地改状态（避免与主进程不一致）
            })
            .catch(() => {
              ok.disabled = false;
              no.disabled = false;
            })
            .finally(() => { void kind; });
        };
        ok.addEventListener('click', () => act('browser-panel:approve-action', 'approve'));
        no.addEventListener('click', () => act('browser-panel:reject-action', 'reject'));

        ops.appendChild(ok);
        ops.appendChild(no);
        card.appendChild(info);
        card.appendChild(ops);
        list.appendChild(card);
      });
    }

    api.onPendingActions(render);
    // 首帧主动拉一次（防止浮层加载晚于第一次推送，导致界面空白）
    api.invoke('browser-panel:list-pending-actions').then(render).catch(() => {});
  </script>
</body>
</html>
